name: Release Nickelite

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Verify versioned packages
      run: |
        version="${GITHUB_REF_NAME#v}"
        test -d "dist/$version"
        cd "dist/$version"
        sha256sum -c SHA256SUMS
        for package in *.zip; do
          work="$(mktemp -d)"
          unzip -q "$package" -d "$work"
          (cd "$work" && sha256sum -c SHA256SUMS)
        done
    - name: Publish release assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$GITHUB_REF_NAME" "dist/$version/"*.zip "dist/$version/SHA256SUMS" \
            scripts/install.sh scripts/install.ps1 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Nickelite $version" --notes-file "dist/$version/RELEASE.md"
        else
          gh release create "$GITHUB_REF_NAME" "dist/$version/"*.zip "dist/$version/SHA256SUMS" \
            scripts/install.sh scripts/install.ps1 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Nickelite $version" \
            --notes-file "dist/$version/RELEASE.md"
        fi
